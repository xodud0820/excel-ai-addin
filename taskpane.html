<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
 body{font-family:Segoe UI,sans-serif;font-size:13px;margin:0;padding:10px;color:#222}
 h3{margin:4px 0 8px} .row{margin:6px 0} label{display:block;font-size:12px;color:#555}
 input,select,textarea{width:100%;box-sizing:border-box;padding:5px;font:inherit}
 textarea{height:80px} button{padding:7px 12px;margin-right:6px;cursor:pointer}
 .primary{background:#107c41;color:#fff;border:0} #log{white-space:pre-wrap;background:#f5f5f5;padding:8px;margin-top:8px;max-height:260px;overflow:auto}
 #sel{background:#e8f4ec;padding:4px 6px;border-radius:3px} details{margin-bottom:8px}
</style></head><body>
<h3>AI 셀 어시스턴트</h3>
<details id="cfg"><summary>설정 (API)</summary>
 <div class="row"><label>제공자</label>
  <select id="provider"><option value="gemini">Gemini (권장)</option><option value="timely">기타 OpenAI 호환 (Timely 등)</option></select></div>
 <div class="row"><label>Endpoint (Timely: chat/completions URL)</label><input id="endpoint" placeholder="https://.../v1/chat/completions"/></div>
 <div class="row"><label>모델</label><input id="model" placeholder="예: gemini-2.0-flash"/></div>
 <div class="row"><label>API Key</label><input id="key" type="password"/></div>
 <button onclick="saveCfg()">저장</button>
</details>
<div class="row"><label>대상 범위</label>
 <select id="scope">
  <option value="selection">현재 선택 영역</option>
  <option value="used">시트 전체 사용 범위</option>
  <option value="custom">직접 입력 (예: B2:B100, C:C, 3:3)</option>
 </select></div>
<div class="row" id="customRow" style="display:none"><input id="custom" placeholder="B2:B100"/></div>
<div class="row"><span id="sel">선택: -</span></div>
<div class="row"><label>이미지 (체크한 이미지가 대상) <a href="#" onclick="listShapes();return false">새로고침</a></label><div id="shapes"></div></div>
<div class="row"><label>지시사항 (자연어)</label>
 <textarea id="prompt" placeholder="예: B열 회사명에서 (주) 제거 / 체크한 이미지를 B2:D6 칸에 비율 유지로 맞춰줘 / 이미지 너비를 200pt로"></textarea></div>
<button class="primary" id="run" onclick="run()">실행(미리보기)</button>
<button id="apply" onclick="apply()" disabled>적용</button>
<button id="undo" onclick="undo()" disabled>되돌리기</button>
<div id="log"></div>
<script src="taskpane.js"></script></body></html>
